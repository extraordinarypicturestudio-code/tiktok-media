name: Publish recipe_crave

# 4 publications/jour, meme logique anti-cannibalisation que TopRankTV
# (2 creneaux France espaces, 2 creneaux US espaces), alignee avec 15 min
# de decalage pour eviter deux publications simultanees sur le meme depot :
#   - 11h15 UTC = 13h15 Paris/CEST (creneau midi France)
#   - 16h15 UTC = 12h15 EDT       (creneau midi US)
#   - 20h15 UTC = 22h15 Paris/CEST (creneau soir France)
#   - 23h15 UTC = 19h15 EDT       (creneau soir US, prime time)
# EDT = UTC-4 / CEST = UTC+2 (ete, en vigueur en aout). A ajuster de 1h
# chacun en hiver (EST = UTC-5, CET = UTC+1).
on:
  schedule:
    - cron: "15 11 * * *"
    - cron: "15 16 * * *"
    - cron: "15 20 * * *"
    - cron: "15 23 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ffprobe/ffmpeg ne sont pas preinstalles sur le runner : necessaires
      # pour la verification des specs et la reparation FPS avant envoi.
      - name: Installer ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Publier la prochaine recette en attente
        env:
          ZERNIO_API_KEY: ${{ secrets.ZERNIO_API_KEY }}
        run: python3 scripts/publish_next.py queue-recipecrave.json recipe_crave

      # always() : meme si la publication echoue, l'etat de la file (compteur
      # de tentatives, statut d'erreur) doit etre sauvegarde.
      - name: Enregistrer la mise a jour de la file d'attente
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          # -A capture aussi la suppression du clip local et la mise a jour
          # du registre de hashs faites par publish_next.py apres succes.
          # mkdir -p : dossier vide (tout publie) = non suivi par git, et
          # "git add -- dossier/" plante sur un pathspec inexistant sinon.
          mkdir -p clips
          git add -A -- queue-recipecrave.json used-clips-hashes.json clips/
          git diff --cached --quiet && exit 0
          git commit -m "Mise a jour file d'attente recipe_crave [skip ci]"
          # Les deux workflows publient sur le meme depot et les crons GitHub
          # peuvent deriver de plus d'une heure : sans rebase, le push du
          # second workflow est rejete et la file perd sa mise a jour.
          for essai in 1 2 3 4 5; do
            git pull --rebase origin main && git push && exit 0
            echo "Push rejete (essai $essai/5), nouvelle tentative..."
            sleep 10
          done
          echo "::error::Impossible de pousser la mise a jour de la file apres 5 essais"
          exit 1
