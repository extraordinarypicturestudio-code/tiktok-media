name: Controle de sante

# Verifie que les publications sortent reellement et que les files sont
# saines, RATTRAPE tout seul un creneau manque, et n'alerte QUE si une action
# humaine est vraiment necessaire (pas de mail quotidien inutile).
#
# Toutes les 4h et non une fois par jour : un creneau manque doit etre
# rattrape dans la journee, pas le lendemain. Le cout est nul (job de ~1 min)
# et sans effet de bord : le rattrapage ne se declenche que si la chaine est
# REELLEMENT silencieuse au-dela de son seuil (voir silence_max_h).
on:
  schedule:
    - cron: "0 */4 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

jobs:
  verifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ffprobe est utilise pour verifier les specs (FPS, duree) des clips.
      - name: Installer ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Croiser les files avec l'etat reel cote Zernio
        id: check
        env:
          ZERNIO_API_KEY: ${{ secrets.ZERNIO_API_KEY }}
          ZERNIO_API_KEY_2: ${{ secrets.ZERNIO_API_KEY_2 }}
        run: python3 scripts/healthcheck.py

      # Rattrapage : si une chaine est restee silencieuse au-dela de son
      # seuil (creneau cron saute par GitHub, panne temporaire...), on publie
      # nous-memes ici. On execute directement le script de publication au
      # lieu de declencher l'autre workflow : GITHUB_TOKEN n'a pas le droit
      # de declencher un workflow_dispatch (protection anti-recursion de
      # GitHub), un tel appel serait accepte mais ne lancerait jamais rien.
      - name: Rattraper les creneaux manques
        if: always()
        env:
          ZERNIO_API_KEY: ${{ secrets.ZERNIO_API_KEY }}
          ZERNIO_API_KEY_2: ${{ secrets.ZERNIO_API_KEY_2 }}
        run: |
          if [ ! -f rattrapages.txt ]; then
            echo "Aucun creneau a rattraper."
            exit 0
          fi
          while IFS='|' read -r script queue pseudo cle; do
            [ -z "$script" ] && continue
            echo "::warning::Rattrapage automatique : $pseudo (via $script)"
            # La cle Zernio differe selon la chaine : on expose la bonne sous
            # le nom attendu par les scripts (ZERNIO_API_KEY).
            ZERNIO_API_KEY="${!cle}" python3 "scripts/$script" "$queue" "$pseudo" || \
              echo "::warning::Rattrapage de $pseudo sans succes, nouvelle tentative au prochain controle"
          done < rattrapages.txt

      # always() : le controle peut auto-resoudre des videos 'unconfirmed'
      # (voir resoudre_incertains dans healthcheck.py) meme quand il detecte
      # par ailleurs une anomalie reelle ailleurs - les deux ne s'excluent
      # pas, donc on committe dans tous les cas.
      - name: Enregistrer les corrections automatiques
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          # -A sur les queues et dossiers de clips : capture a la fois les
          # auto-corrections du healthcheck ET les effets d'un eventuel
          # rattrapage (file mise a jour, clip publie supprime, registre de
          # hashs complete).
          # mkdir -p : si un dossier de clips est vide (tout publie), git ne
          # le suit pas et "git add -- dossier/" plante avec une erreur
          # pathspec sur un chemin inexistant - le creer garantit que le
          # pathspec matche toujours (meme sur un dossier vide).
          mkdir -p clips clips-toprank clips-bigfoot
          git add -A -- queue-toprank.json queue-recipecrave.json \
                        queue-bigfoot.json used-clips-hashes.json \
                        clips/ clips-toprank/ clips-bigfoot/
          git diff --cached --quiet && echo "Rien a enregistrer." && exit 0
          git commit -m "Auto-correction / rattrapage du controle de sante [skip ci]"
          for essai in 1 2 3 4 5; do
            git pull --rebase origin main && git push && exit 0
            echo "Push rejete (essai $essai/5), nouvelle tentative..."
            sleep 10
          done
          echo "::error::Impossible de pousser les corrections apres 5 essais"
          exit 1

      # Alerte uniquement si le script a ecrit un fichier d'anomalies. Le run
      # lui-meme reste en succes (voir commentaire en fin de healthcheck.py) :
      # on ne veut pas d'un mail "Run failed" toutes les 4h pour un stock bas.
      - name: Ouvrir une alerte
        if: always() && hashFiles('healthcheck-anomalies.txt') != ''
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let details = 'Voir les logs du run pour le detail.';
            try {
              details = fs.readFileSync('healthcheck-anomalies.txt', 'utf8');
            } catch (e) {}

            const titre = 'Pipeline TikTok : anomalie detectee';
            const corps = [
              'Le controle de sante quotidien a trouve des anomalies :',
              '',
              details,
              '',
              `Run : ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            ].join('\n');

            // Une seule alerte, point. Si une issue est deja ouverte, on ne
            // commente MEME PAS : le controle tourne toutes les 4h et un
            // commentaire a chaque passage renotifierait 6 fois par jour pour
            // le meme probleme deja signale. L'utilisateur ferme l'issue quand
            // c'est traite ; une nouvelle alerte ne partira qu'apres.
            const ouvertes = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'pipeline-alerte',
            });

            if (ouvertes.data.length > 0) {
              core.info('Alerte deja ouverte (#' + ouvertes.data[0].number +
                        ') : aucune nouvelle notification envoyee.');
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: titre,
                body: corps,
                labels: ['pipeline-alerte'],
              });
            }
