# CHAINE EN PAUSE depuis le 2026-09-06, sur consigne de l'utilisateur.
# Le workflow est DESACTIVE cote GitHub (disabled_manually) : le reactiver
# ferait sortir immediatement une des huit videos en file, qui portent toutes
# la voix Charon - une voix que l'utilisateur n'a pas validee. La chaine n'a
# encore jamais publie ; sa premiere video fixera son identite sonore.
# A reactiver une fois la voix choisie et les videos refaites, en remettant
# aussi le quota de la chaine a 2 dans scripts/programmer_avance.py.
#
name: Publish Le Pisciniste

# 2 publications/jour : 09h00 et 14h00 Paris (CEST = UTC+2 en ete).
#   - 07h00 UTC = 09h00 Paris
#   - 12h00 UTC = 14h00 Paris
# A decaler d'une heure en hiver (CET = UTC+1) pour rester cale sur ces heures
# locales. Aucun de ces creneaux ne recoupe love_kitchen (12h, 20h, 22h30),
# toprank (13h, 18h30, 21h) ni mindshift (08h, 19h, 21h30).
#
# POURQUOI CE WORKFLOW EXISTE
# ---------------------------
# Jusqu'au 2026-09-05 argile ne publiait pas comme les autres chaines : ses
# videos etaient programmees directement sur Zernio, des heures a l'avance, une
# par creneau. Quand TikTok refusait au declenchement pour saturation
# ("TikTok direct posting is at capacity"), le creneau etait perdu SEC : pas de
# file, pas de remplacant, rien ne sortait.
#
# Les chaines qui fonctionnent (recipe_crave, toprank, mindshift) ne programment
# rien a l'avance. Leurs videos attendent en `pending` dans une file ; le cron
# prend la suivante et demande a Zernio de publier IMMEDIATEMENT. Si TikTok
# refuse, la video retourne en `pending` et le script enchaine sur le candidat
# suivant DANS LE MEME RUN : le creneau est sauve et la video refusee repartira
# plus tard. Trois tentatives avant abandon definitif.
#
# argile utilise desormais exactement ce mecanisme.
# HORAIRES DEPLACES LE 2026-09-05. Les creneaux 16h et 20h UTC (18h et 22h
# Paris) ont ete refuses QUATRE FOIS par TikTok pour saturation : 31/08, 02/09,
# et encore le 05/09 a 17h17. Les memes videos passent sans probleme la nuit
# (04/09 a 23h37 et 04h18 UTC), et les autres chaines du projet publient sans
# incident a 11h et 16h30 UTC.
#
# La capacite de publication par API est partagee entre tous les utilisateurs
# de Zernio : elle s'epuise aux heures de forte demande. Choisir des creneaux
# moins disputes vaut mieux que rattraper des echecs.
# DECALAGE EN MINUTES, decide le 2026-09-05. Les crons a l'heure ronde sont
# les plus encombres : GitHub met ses declenchements en file d'attente et peut
# les retarder de plusieurs dizaines de minutes, et la capacite de publication
# TikTok s'epuise aux memes moments. Quelques minutes de decalage suffisent a
# sortir du pic, et separent aussi les chaines entre elles pour qu'elles ne
# poussent jamais sur le depot en meme temps.
on:
  schedule:
    - cron: "21 8 * * *"
    - cron: "21 14 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ffprobe/ffmpeg ne sont pas preinstalles sur le runner : necessaires
      # pour la verification des specs et la reparation FPS avant envoi.
      - name: Installer ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Publier la prochaine video en attente
        env:
          # argile.histoires est sur la QUATRIEME cle Zernio, avec
          # darkness3038. Se tromper de cle donne "compte introuvable".
          ZERNIO_API_KEY: ${{ secrets.ZERNIO_API_KEY_5 }}
          # Sert uniquement a choisir la vignette. Absent = vignette par
          # defaut a 2s, jamais bloquant.
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python3 scripts/publish_next.py queue-pisciniste.json le.pisciniste7

      # always() : meme si la publication echoue, l'etat de la file (compteur
      # de tentatives, statut d'erreur) doit etre sauvegarde. C'est lui qui
      # permet de reprendre la video au creneau suivant.
      - name: Enregistrer la mise a jour de la file d'attente
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          mkdir -p clips-pisciniste
          git add -A -- queue-pisciniste.json used-clips-hashes.json clips-pisciniste/
          git diff --cached --quiet && exit 0
          git commit -m "Mise a jour file d attente pisciniste [skip ci]"
          # Plusieurs workflows poussent sur le meme depot et les crons GitHub
          # peuvent deriver de plus d'une heure : sans rebase, le push du
          # second est rejete et la file perd sa mise a jour.
          for essai in 1 2 3 4 5; do
            git pull --rebase origin main && git push && exit 0
            echo "Push rejete (essai $essai/5), nouvelle tentative..."
            sleep 10
          done
          echo "::error::Impossible de pousser la mise a jour de la file apres 5 essais"
          exit 1
