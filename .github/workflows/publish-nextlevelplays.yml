name: Publish NextLevelPlays

# Chaine TikTok "sport amateur" (@nextlevelplays88), hebergee sur le 2eme
# compte Zernio (celui de Bigfoot Content) - le compte principal etait deja
# plein (2/2 connexions TikTok gratuites avec TopRankTV + recipe_crave).
#
# 3 publications/jour (demande explicite, different des 4/jour de
# TopRankTV/recipe_crave), calees uniquement sur le marche US (audience
# internationale visee pour cette chaine, pas de creneau France dedie) et
# bien espacees dans la journee pour ne jamais se cannibaliser :
#   - 12h45 UTC = 08h45 EDT (creneau matin US)
#   - 17h45 UTC = 13h45 EDT (creneau midi US)
#   - 23h45 UTC = 19h45 EDT (creneau soir US, prime time)
# Minutes 45 choisies pour ne jamais tomber sur les memes minutes que
# TopRankTV (minute 00) ou recipe_crave (minute 15), meme quand les heures
# se recoupent (ex. 23h) - evite toute collision de push simultane.
# EDT = UTC-4 (heure d'ete US, en vigueur en aout). A ajuster de 1h en
# hiver (EST = UTC-5).
# SATURATION TIKTOK — CE BLOC DISAIT LE CONTRAIRE JUSQU'AU 2026-09-06.
#
# Il affirmait que les refus "TikTok direct posting is at capacity" tombaient
# tous entre 17h et 20h UTC, et concluait "NE PAS y replacer un creneau".
# C'etait une correlation lue a l'envers : c'est aussi la tranche ou nos six
# workflows et le rattrapage envoyaient le plus, et le plus vite.
#
# Mesure sur les 300 dernieres tentatives, en separant celles qui n'avaient
# AUCUNE autre tentative de notre part dans les 30 minutes precedentes :
#
#     ISOLEES : 210 / 215 reussies (98 %), et 90 a 100 % A CHAQUE HEURE
#     TOUTES  : 260 / 300 reussies (87 %), 48 % sur la tranche de 17h UTC
#
# Une tentative isolee passe a toute heure, minuit comme 19h. Ce qui fait
# echouer, c'est la rafale. Les sorties sont donc deposees a l'avance sur une
# grille espacee de 80 minutes (programmer-avance.yml) et ce workflow-ci ne
# sert plus que de filet : il ne trouve du "pending" que si une video est
# revenue en file.
on:
  schedule:
    - cron: "45 12 * * *"
    - cron: "45 15 * * *"
    - cron: "45 23 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ffprobe/ffmpeg ne sont pas preinstalles sur le runner : necessaires
      # pour la verification des specs et la reparation FPS avant envoi.
      - name: Installer ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Publier la prochaine video en attente
        env:
          ZERNIO_API_KEY: ${{ secrets.ZERNIO_API_KEY_2 }}
          # Sert uniquement a choisir la vignette (image de couverture).
          # Si le secret est absent, la publication part quand meme avec la
          # vignette par defaut a 2s - jamais bloquante.
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python3 scripts/publish_next.py queue-nextlevelplays.json nextlevelplays88

      # always() : meme si la publication echoue, l'etat de la file (compteur
      # de tentatives, statut d'erreur) doit etre sauvegarde.
      - name: Enregistrer la mise a jour de la file d'attente
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          # mkdir -p : dossier vide (tout publie) = non suivi par git, et
          # "git add -- dossier/" plante sur un pathspec inexistant sinon.
          mkdir -p clips-nextlevelplays
          git add -A -- queue-nextlevelplays.json used-clips-hashes.json clips-nextlevelplays/
          git diff --cached --quiet && exit 0
          git commit -m "Mise a jour file d'attente NextLevelPlays [skip ci]"
          # Plusieurs workflows publient sur le meme depot et les crons GitHub
          # peuvent deriver de plus d'une heure : sans rebase, le push est
          # rejete et la file perd sa mise a jour.
          for essai in 1 2 3 4 5; do
            git pull --rebase origin main && git push && exit 0
            echo "Push rejete (essai $essai/5), nouvelle tentative..."
            sleep 10
          done
          echo "::error::Impossible de pousser la mise a jour de la file apres 5 essais"
          exit 1
