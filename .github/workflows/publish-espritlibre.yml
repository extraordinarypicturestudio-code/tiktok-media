name: Publish esprit_libre

# 4 publications/jour, meme logique que recipe_crave, decalee de 30 min pour
# ne jamais tomber sur le meme creneau (evite deux workflows qui poussent sur
# le meme depot en meme temps) :
#   - 06h30 UTC = 08h30 Paris/CEST (matin)
#   - 12h30 UTC = 14h30 Paris/CEST (apres-midi)
#   - 17h30 UTC = 19h30 Paris/CEST (soir)
#   - 21h30 UTC = 23h30 Paris/CEST (fin de soiree)
# CEST = UTC+2 (ete, en vigueur en aout). A ajuster de 1h en hiver (CET = UTC+1).
on:
  schedule:
    - cron: "30 6 * * *"
    - cron: "30 12 * * *"
    - cron: "30 17 * * *"
    - cron: "30 21 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ffprobe/ffmpeg ne sont pas preinstalles sur le runner : necessaires
      # pour la verification des specs et la reparation FPS avant envoi.
      - name: Installer ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Publier la prochaine video en attente
        env:
          ZERNIO_API_KEY: ${{ secrets.ZERNIO_API_KEY_3 }}
          # Sert uniquement a choisir la vignette (image de couverture).
          # Si le secret est absent, la publication part quand meme avec la
          # vignette par defaut a 2s - jamais bloquante.
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python3 scripts/publish_next.py queue-espritlibre.json esprit.libre18

      # always() : meme si la publication echoue, l'etat de la file (compteur
      # de tentatives, statut d'erreur) doit etre sauvegarde.
      - name: Enregistrer la mise a jour de la file d'attente
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          # -A capture aussi la suppression du clip local et la mise a jour
          # du registre de hashs faites par publish_next.py apres succes.
          # mkdir -p : dossier vide (tout publie) = non suivi par git, et
          # "git add -- dossier/" plante sur un pathspec inexistant sinon.
          mkdir -p clips-espritlibre
          git add -A -- queue-espritlibre.json used-clips-hashes.json clips-espritlibre/
          git diff --cached --quiet && exit 0
          git commit -m "Mise a jour file d'attente esprit_libre [skip ci]"
          # Plusieurs workflows publient sur le meme depot et les crons GitHub
          # peuvent deriver de plus d'une heure : sans rebase, le push du
          # second workflow est rejete et la file perd sa mise a jour.
          for essai in 1 2 3 4 5; do
            git pull --rebase origin main && git push && exit 0
            echo "Push rejete (essai $essai/5), nouvelle tentative..."
            sleep 10
          done
          echo "::error::Impossible de pousser la mise a jour de la file apres 5 essais"
          exit 1
