name: Programmer les sorties a l'avance

# POURQUOI CE WORKFLOW REMPLACE LA PUBLICATION IMMEDIATE
# ------------------------------------------------------
# Les workflows publish-*.yml appelaient publish_next.py, qui publie DANS LA
# MINUTE (`publishNow: true`) et tente jusqu'a trois candidats d'affilee en cas
# de refus. Six chaines faisaient donc, plusieurs fois par jour, des paquets de
# tentatives rapprochees - auxquels s'ajoutaient les relances du rattrapage.
#
# Mesure du 2026-09-06 sur les 300 dernieres tentatives, en ne retenant que
# celles sans AUCUNE autre tentative de notre part dans les 30 minutes
# precedentes :
#
#     tentatives ISOLEES : 210 / 215 reussies  (98 %), et 90 a 100 % A CHAQUE
#                          HEURE DU JOUR, minuit comme 19h
#     toutes tentatives  : 260 / 300 reussies  (87 %), 48 % a 17h UTC
#
# Ce n'est donc pas l'heure qui fait refuser une publication - c'est d'en
# tenter plusieurs coup sur coup. Ce workflow depose les videos a l'avance chez
# Zernio, sur une grille commune espacee de 80 minutes : plus aucune rafale
# possible, et un creneau GitHub manque (les evenements `schedule` sont
# massivement retardes ou perdus) ne coute plus une sortie puisque le post est
# deja depose.
on:
  schedule:
    # Une fois par jour, a une heure ronde evitee par la grille de depot.
    - cron: "40 4 * * *"
  workflow_dispatch:
    inputs:
      jours:
        description: "Horizon de programmation, en jours"
        default: "14"
      essai:
        description: "true = n'envoie rien, affiche seulement la grille"
        default: "false"

permissions:
  contents: write

concurrency:
  # Deux executions simultanees deposeraient deux videos sur le meme creneau.
  group: programmation
  cancel-in-progress: false

jobs:
  programmer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Installer ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      # Aligner les files AVANT de deposer : une video deja en ligne mais
      # restee "pending" se ferait refuser par un 409 "already posted to this
      # account within the last 24 hours", et occuperait un creneau pour rien.
      - name: Aligner les files sur Zernio
        env:
          ZERNIO_API_KEY: ${{ secrets.ZERNIO_API_KEY }}
          ZERNIO_API_KEY_2: ${{ secrets.ZERNIO_API_KEY_2 }}
          ZERNIO_API_KEY_4: ${{ secrets.ZERNIO_API_KEY_4 }}
          ZERNIO_API_KEY_5: ${{ secrets.ZERNIO_API_KEY_5 }}
        run: python3 scripts/reconcilier_programmes.py

      # Un gros depot epuise le quota Gemini (500 requetes/jour) et les
      # dernieres videos partent avec la vignette par defaut a 2 s, soit un
      # plan d'intro. Comme les sorties sont deposees plusieurs jours a
      # l'avance, on refait ces couvertures le lendemain, quota reinitialise,
      # AVANT la date de sortie. Passe en premier : c'est du rattrapage sur des
      # videos deja programmees, donc prioritaire sur de nouveaux depots.
      - name: Refaire les vignettes restees par defaut
        env:
          ZERNIO_API_KEY: ${{ secrets.ZERNIO_API_KEY }}
          ZERNIO_API_KEY_2: ${{ secrets.ZERNIO_API_KEY_2 }}
          ZERNIO_API_KEY_4: ${{ secrets.ZERNIO_API_KEY_4 }}
          ZERNIO_API_KEY_5: ${{ secrets.ZERNIO_API_KEY_5 }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python3 scripts/corriger_vignettes.py

      - name: Deposer les prochaines sorties
        env:
          ZERNIO_API_KEY: ${{ secrets.ZERNIO_API_KEY }}
          ZERNIO_API_KEY_2: ${{ secrets.ZERNIO_API_KEY_2 }}
          ZERNIO_API_KEY_4: ${{ secrets.ZERNIO_API_KEY_4 }}
          ZERNIO_API_KEY_5: ${{ secrets.ZERNIO_API_KEY_5 }}
          # Sert uniquement au choix de la vignette. Absente = vignette par
          # defaut a 2s, jamais bloquant.
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python3 scripts/programmer_avance.py \
            --jours "${{ github.event.inputs.jours || '14' }}" \
            ${{ github.event.inputs.essai == 'true' && '--essai' || '' }}

      - name: Enregistrer les files
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          # `git add -- <chemin>` sort en 128 si le chemin n'existe pas, et
          # l'etape tourne sous `bash -e` : le job echoue AVANT le commit, donc
          # le travail du script est perdu. Arrive des que clips-argile/ a ete
          # vide de ses clips publies - alignement et depot ont echoue quatre
          # fois de suite sans que rien ne le signale, et les files sur
          # origin/main ont cesse de refleter la realite. On n'ajoute donc
          # que les dossiers qui existent au moment du run.
          chemins="queue-*.json used-clips-hashes.json"
          for d in clips clips-argile clips-lovekitchen clips-mindshift clips-pisciniste clips-toprank; do
            [ -d "$d" ] && chemins="$chemins $d"
          done
          git add -A -- $chemins
          git diff --cached --quiet && exit 0
          git commit -m "Programmation des sorties a l'avance [skip ci]"
          for essai in 1 2 3 4 5; do
            git pull --rebase origin main && git push && exit 0
            # Une file JSON ne se fusionne pas ligne a ligne : le rebase
            # s'arrete en conflit, et sans cette sortie les quatre tentatives
            # suivantes echouent TOUTES sur "Pulling is not possible because
            # you have unmerged files". C'est ce qui a fait echouer
            # l'alignement du 2026-09-09 a 12h29, et le travail du script
            # etait perdu alors qu'il etait juste.
            # On garde NOTRE version du fichier en conflit : elle vient d'etre
            # recalculee sur l'etat reel du compte, celle du depot est plus
            # ancienne. Pendant un rebase, "theirs" designe le commit rejoue,
            # donc bien le notre.
            conflits=$(git diff --name-only --diff-filter=U)
            if [ -n "$conflits" ]; then
              git checkout --theirs -- $conflits || true
              git add -- $conflits
              GIT_EDITOR=true git rebase --continue || git rebase --abort || true
            else
              git rebase --abort 2>/dev/null || true
            fi
            echo "Push rejete (essai $essai/5), nouvelle tentative..."
            sleep 10
          done
          echo "::error::Impossible de pousser les files apres 5 essais"
          exit 1
