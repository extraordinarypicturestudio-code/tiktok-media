name: Publish Mindshift

# Mindshift remplace esprit_libre depuis le 2026-08-22. Horaires demandes :
#   - 08h00 Paris/CEST = 06h00 UTC (matin)
#   - 19h00 Paris/CEST = 17h00 UTC (soir)
#   - 21h30 Paris/CEST = 19h30 UTC (nuit)
# CEST = UTC+2 (ete). A decaler d'une heure en hiver (CET = UTC+1).
#
# Aucun de ces creneaux ne tombe sur un autre workflow du depot :
# recipecrave publie a :15, toprank a :00, nextlevelplays a :45 (12h/17h/23h)
# et bigfoot a 16h30 et 00h30. Deux workflows au meme creneau se disputent
# le push de la file.
on:
  schedule:
    - cron: "0 6 * * *"
    - cron: "0 17 * * *"
    - cron: "30 19 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ffprobe/ffmpeg ne sont pas preinstalles sur le runner : necessaires
      # pour la verification des specs et la reparation FPS avant envoi.
      - name: Installer ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Publier la prochaine video en attente
        env:
          # mindshift716 est connecte sur la DEUXIEME cle Zernio, avec
          # love_kitchen97 - et non sur la troisieme, qui portait
          # esprit.libre18.
          ZERNIO_API_KEY: ${{ secrets.ZERNIO_API_KEY_2 }}
          # Sert uniquement a choisir la vignette (image de couverture).
          # Si le secret est absent, la publication part quand meme avec la
          # vignette par defaut a 2s - jamais bloquante.
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python3 scripts/publish_next.py queue-mindshift.json mindshift716

      # always() : meme si la publication echoue, l'etat de la file (compteur
      # de tentatives, statut d'erreur) doit etre sauvegarde.
      - name: Enregistrer la mise a jour de la file d'attente
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          # -A capture aussi la suppression du clip local et la mise a jour
          # du registre de hashs faites par publish_next.py apres succes.
          # mkdir -p : dossier vide (tout publie) = non suivi par git, et
          # "git add -- dossier/" plante sur un pathspec inexistant sinon.
          mkdir -p clips-mindshift
          git add -A -- queue-mindshift.json used-clips-hashes.json clips-mindshift/
          git diff --cached --quiet && exit 0
          git commit -m "Mise a jour file d'attente mindshift [skip ci]"
          # Plusieurs workflows publient sur le meme depot et les crons GitHub
          # peuvent deriver de plus d'une heure : sans rebase, le push du
          # second workflow est rejete et la file perd sa mise a jour.
          for essai in 1 2 3 4 5; do
            git pull --rebase origin main && git push && exit 0
            echo "Push rejete (essai $essai/5), nouvelle tentative..."
            sleep 10
          done
          echo "::error::Impossible de pousser la mise a jour de la file apres 5 essais"
          exit 1
